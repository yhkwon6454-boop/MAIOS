<!DOCTYPE html><html><head><meta charset='utf-8'><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a887f;--line:#dedcd5;
--panel:#f3f2ee;--blue:#2a78d6;--blue-d:#1c5cab;--aqua:#1baf7a;--yellow:#eda100;
--green:#008300;--red:#e34948;--violet:#4a3aa7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ffffff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;padding:10px;}
svg{width:100%;height:auto;display:block;}
svg text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
.tiles{display:flex;gap:14px;}
.tile{flex:1 1 200px;border:1px solid #dedcd5;border-radius:10px;padding:14px 16px;background:#fff;}
.tile .t-label{font-size:13px;color:#52514e;margin-bottom:6px;}
.tile .t-before{font-size:13.5px;color:#8a887f;}
.tile .t-before b{color:#e34948;font-weight:700;}
.tile .t-after{font-size:26px;font-weight:800;color:#1c5cab;line-height:1.3;}
.tile .t-unit{font-size:14px;font-weight:600;color:#52514e;}
</style></head><body><svg class="fig-svg" viewBox="0 0 680 260" role="img" aria-label="온톨로지 접합부 4곳">
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a3aa7"/>
    </marker>
  </defs>
  <!-- ttl -->
  <rect x="20" y="98" width="130" height="60" rx="8" fill="#f3f2ee" stroke="#dedcd5"/>
  <text x="85" y="122" text-anchor="middle" font-size="12.5" font-weight="700">ontology.ttl</text>
  <text x="85" y="140" text-anchor="middle" font-size="11" fill="#52514e">임무형지휘 스키마 v1 발췌본</text>
  <line x1="150" y1="128" x2="208" y2="128" stroke="#4a3aa7" stroke-width="1.8" marker-end="url(#arrV)"/>
  <!-- adapter -->
  <rect x="210" y="88" width="180" height="80" rx="10" fill="#ffffff" stroke="#4a3aa7" stroke-width="2"/>
  <text x="300" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a3aa7">OntologyAdapter</text>
  <text x="300" y="134" text-anchor="middle" font-size="11" fill="#52514e">라벨 이웃 인덱스</text>
  <text x="300" y="150" text-anchor="middle" font-size="10.5" fill="#52514e">subClassOf · type · domain/range</text>
  <!-- junctions -->
  <g font-size="12" text-anchor="middle">
    <rect x="470" y="14" width="190" height="46" rx="8" fill="#e8f0fb" stroke="#2a78d6"/>
    <text x="565" y="33" font-weight="700">J1 회상 확장</text>
    <text x="565" y="50" font-size="10.5" fill="#52514e">질의 → 개념 이웃 합류 (7.2)</text>
    <rect x="470" y="72" width="190" height="46" rx="8" fill="#e8f0fb" stroke="#2a78d6"/>
    <text x="565" y="91" font-weight="700">J2 거버넌스 상향</text>
    <text x="565" y="108" font-size="10.5" fill="#52514e">위험 개념 이웃 → 인간 승인 (7.3)</text>
    <rect x="470" y="130" width="190" height="46" rx="8" fill="#e8f0fb" stroke="#2a78d6"/>
    <text x="565" y="149" font-weight="700">J4 의도-행동 정렬</text>
    <text x="565" y="166" font-size="10.5" fill="#52514e">ALIGNED / CHECK / CONFLICT (7.4)</text>
    <rect x="470" y="188" width="190" height="46" rx="8" fill="#fbfaf8" stroke="#8a887f" stroke-dasharray="5 4"/>
    <text x="565" y="207" font-weight="700" fill="#52514e">J3 ABox 개체 추출</text>
    <text x="565" y="224" font-size="10.5" fill="#8a887f">미구현 — LLM 결합 필요</text>
  </g>
  <g stroke="#4a3aa7" stroke-width="1.6" fill="none">
    <path d="M 390 108 C 430 100 430 44 468 38" marker-end="url(#arrV)"/>
    <path d="M 390 122 C 430 118 430 96 468 95" marker-end="url(#arrV)"/>
    <path d="M 390 140 C 430 144 430 152 468 152" marker-end="url(#arrV)"/>
    <path d="M 390 154 C 430 164 430 210 468 210" stroke-dasharray="5 4" marker-end="url(#arrV)"/>
  </g>
  <text x="85" y="196" font-size="11.5" fill="#52514e">폴백(P7): 온톨로지 부재·</text>
  <text x="85" y="212" font-size="11.5" fill="#52514e">파싱 실패 시 기존 동작 유지</text>
</svg></body></html>
