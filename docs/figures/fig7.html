<!DOCTYPE html><html><head><meta charset='utf-8'><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a887f;--line:#dedcd5;
--panel:#f3f2ee;--blue:#2a78d6;--blue-d:#1c5cab;--aqua:#1baf7a;--yellow:#eda100;
--green:#008300;--red:#e34948;--violet:#4a3aa7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ffffff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;padding:10px;}
svg{width:100%;height:auto;display:block;}
svg text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;}
.tiles{display:flex;gap:14px;}
.tile{flex:1 1 200px;border:1px solid #dedcd5;border-radius:10px;padding:14px 16px;background:#fff;}
.tile .t-label{font-size:13px;color:#52514e;margin-bottom:6px;}
.tile .t-before{font-size:13.5px;color:#8a887f;}
.tile .t-before b{color:#e34948;font-weight:700;}
.tile .t-after{font-size:26px;font-weight:800;color:#1c5cab;line-height:1.3;}
.tile .t-unit{font-size:14px;font-weight:600;color:#52514e;}
</style></head><body><svg class="fig-svg" viewBox="0 0 680 250" role="img" aria-label="의도-행동 정렬 판정 흐름도">
  <defs>
    <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="20" y="96" width="130" height="52" rx="8" fill="#0b0b0b"/>
  <text x="85" y="118" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">행동(목표)</text>
  <text x="85" y="136" text-anchor="middle" font-size="10.5" fill="#c3c2b7">± 온톨로지 확장</text>
  <line x1="150" y1="122" x2="186" y2="122" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrK)"/>
  <!-- decision 1 -->
  <rect x="188" y="92" width="150" height="60" rx="8" fill="#fbfaf8" stroke="#dedcd5"/>
  <text x="263" y="116" text-anchor="middle" font-size="12" font-weight="700">제한사항 접촉?</text>
  <text x="263" y="134" text-anchor="middle" font-size="10.5" fill="#52514e">conflictsWith</text>
  <!-- risk covered -->
  <rect x="378" y="20" width="160" height="56" rx="8" fill="#fbfaf8" stroke="#dedcd5"/>
  <text x="458" y="43" text-anchor="middle" font-size="12" font-weight="700">수용가능위험으로</text>
  <text x="458" y="60" text-anchor="middle" font-size="12" font-weight="700">면책?</text>
  <!-- decision 2 -->
  <rect x="378" y="112" width="160" height="60" rx="8" fill="#fbfaf8" stroke="#dedcd5"/>
  <text x="458" y="136" text-anchor="middle" font-size="12" font-weight="700">핵심과업·목적 지원?</text>
  <text x="458" y="154" text-anchor="middle" font-size="10.5" fill="#52514e">supportsTask · servesPurpose</text>
  <!-- verdicts -->
  <g text-anchor="middle" font-size="13" font-weight="800">
    <rect x="578" y="16" width="84" height="40" rx="8" fill="#fdecec" stroke="#e34948" stroke-width="1.8"/>
    <text x="620" y="41" fill="#a12a29">CONFLICT</text>
    <rect x="578" y="112" width="84" height="40" rx="8" fill="#e9f3e6" stroke="#008300" stroke-width="1.8"/>
    <text x="620" y="137" fill="#005c00">ALIGNED</text>
    <rect x="578" y="184" width="84" height="40" rx="8" fill="#fdf3dd" stroke="#eda100" stroke-width="1.8"/>
    <text x="620" y="209" fill="#8a5c00">CHECK</text>
  </g>
  <g stroke="#52514e" stroke-width="1.5" fill="none">
    <path d="M 263 92 L 263 48 L 376 48" marker-end="url(#arrK)"/>
    <path d="M 338 130 L 376 138" marker-end="url(#arrK)"/>
    <path d="M 538 36 L 576 36" marker-end="url(#arrK)"/>
    <path d="M 538 140 L 576 132" marker-end="url(#arrK)"/>
    <path d="M 458 172 L 458 204 L 576 204" marker-end="url(#arrK)"/>
    <path d="M 458 76 L 458 110" marker-end="url(#arrK)"/>
  </g>
  <g font-size="10.5" fill="#52514e">
    <text x="300" y="42">예</text>
    <text x="352" y="124">아니오</text>
    <text x="552" y="30">아니오</text>
    <text x="470" y="94">예 →</text>
    <text x="552" y="134">예</text>
    <text x="500" y="198">아니오 (연결 미확인)</text>
  </g>
  <text x="620" y="70" text-anchor="middle" font-size="10" fill="#a12a29">→ 거버넌스 HIGH</text>
  <text x="620" y="82" text-anchor="middle" font-size="10" fill="#a12a29">인간 승인 필요</text>
  <text x="620" y="238" text-anchor="middle" font-size="10" fill="#8a5c00">인간 확인 권장</text>
</svg></body></html>
