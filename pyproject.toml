[project]
name = "maios"
version = "0.1.0-alpha"
description = "MUSA AI Operating System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
maios = "maios.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
