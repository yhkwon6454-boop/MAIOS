[project]
name = "maios"
version = "0.1.0-alpha"
description = "MUSA AI Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "MUSA AI" },
]
keywords = [
    "ai",
    "agent",
    "autonomous-runtime",
    "multi-agent",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/MUSA-AI/MAIOS"
Repository = "https://github.com/MUSA-AI/MAIOS"
Issues = "https://github.com/MUSA-AI/MAIOS/issues"

[project.scripts]
maios = "maios.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
